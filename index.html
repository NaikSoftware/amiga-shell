<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AmigaTerm</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="desktop" id="desktop">
  <div class="window">

    <!-- The Electron window is frameless; this IS the title bar. -->
    <div class="titlebar">
      <div class="gadget depth" id="gDepth" title="Depth arrange" role="button" tabindex="0">&#9636;</div>
      <div class="title">AmigaShell &nbsp;<b id="titleOp">~</b></div>
      <div class="meminfo">
        <span class="mem">1,048,576 graphics mem</span>
        <span class="mem">2,097,152 other mem</span>
        <span class="mem" id="clock">--:--:--</span>
      </div>
      <div class="gadget" id="gShrink" title="Shrink" role="button" tabindex="0">&#9633;</div>
      <div class="gadget" id="gZoom" title="Zoom" role="button" tabindex="0">&#9635;</div>
      <div class="gadget" id="gClose" title="Close" role="button" tabindex="0">&#10005;</div>
    </div>

    <div class="workarea">
      <div class="screenwrap" id="screenwrap">
        <!-- the real terminal; xterm.js mounts inside -->
        <div id="term"></div>
        <div class="layer keyflash"></div>
        <div class="layer scanlines"></div>
        <div class="layer rollbar"></div>
        <div class="layer glare"></div>
        <div class="layer vignette"></div>
        <div class="boot" id="boot" hidden></div>
        <div class="guru" id="guru" hidden>
          Software Failure. &nbsp;Press left mouse button to continue.<br>
          Guru Meditation #00000004.0000AAC0
        </div>
      </div>
      <div class="hud" id="hud"></div>
    </div>

    <!-- The HUD's second panel region. Same registry and the same rules as
         the side column; hud.js fills it. -->
    <div class="panelbar" id="panelbar" data-open="0"></div>

    <div class="opstrip">
      <span class="op-label" id="opLabel">STANDBY</span>
      <span class="op-bar"><span class="op-fill" id="opFill"></span></span>
      <!-- the live reading the bar is showing; blank until there is a real one -->
      <span class="op-hex" id="opHex"></span>
    </div>

    <div class="gadgetbar">
      <button class="btn" id="bHud" aria-pressed="true" style="margin-left:8px">HUD</button>
      <span class="sep"></span>
      <span class="hint">F7 bar &middot; F8 shuffle &middot; F10 hud &middot; Ctrl+Shift+C/V copy &middot; right-click a panel to swap it</span>
    </div>

  </div>
</div>

<script type="module" src="renderer.js"></script>
</body>
</html>
